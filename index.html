<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ID Card Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(240px, 300px) 1fr;
      background: #eef1f4;
      color: #17202a;
    }

    .controls {
      padding: 36px 28px;
      background: #173f5f;
      color: #fff;
    }

    .controls h2 {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .intro {
      margin-bottom: 36px;
      color: #b9d3e3;
      font-size: 14px;
    }

    .control-section {
      border: 0;
      margin-bottom: 28px;
    }

    .control-section legend {
      margin-bottom: 10px;
      color: #f6c85f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .btn-group,
    .image-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-group button {
      flex: 1;
      min-width: 70px;
      padding: 9px 12px;
      background: #245779;
      color: #fff;
      border: 1px solid #4d7892;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover,
    button:focus-visible {
      background: #2f7397;
      outline: 2px solid #f6c85f;
      outline-offset: 2px;
    }

    .image-group button {
      padding: 3px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
    }

    .img-option {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    .display-area {
      display: grid;
      place-content: center;
      min-width: 0;
      padding: 40px;
      background: #f7f8f5;
      background-image: linear-gradient(135deg, rgba(23, 63, 95, .06) 25%, transparent 25%), linear-gradient(315deg, rgba(246, 200, 95, .08) 25%, transparent 25%);
      background-size: 32px 32px;
    }

    .card-title {
      margin-bottom: 24px;
      color: #173f5f;
      font-size: clamp(24px, 3vw, 36px);
      text-align: center;
    }

    .card-border {
      width: min(100%, 720px);
      padding: 10px;
      border: 1px solid #d6dde1;
      background: #fff;
      box-shadow: 0 18px 40px rgba(23, 63, 95, .16);
    }

    .card-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 280px;
      gap: 28px;
      padding: 30px;
      background: #173f5f;
      color: #fff;
      border-left: 7px solid #f6c85f;
      transition: background-color .2s ease;
    }

    .details {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .details p:first-child {
      margin-bottom: 8px;
      color: #f6c85f;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    .profile-photo {
      width: 160px;
      height: 190px;
      flex: 0 0 auto;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 6px 6px 0 #f6c85f;
    }

    @media (max-width: 700px) {
      body {
        display: block;
      }

      .controls {
        padding: 24px 20px;
      }

      .intro {
        margin-bottom: 24px;
      }

      .control-section {
        display: inline-block;
        width: 49%;
        vertical-align: top;
        padding-right: 8px;
      }

      .display-area {
        padding: 32px 16px 48px;
      }

      .card-content {
        align-items: flex-start;
        padding: 22px;
      }

      .profile-photo {
        width: 112px;
        height: 136px;
      }
    }

    @media (max-width: 430px) {
      .control-section {
        display: block;
        width: 100%;
      }

      .card-content {
        flex-direction: column-reverse;
        align-items: center;
        text-align: center;
      }

      .details {
        width: 100%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <h2>ID Card Studio</h2>
    <p class="intro">Shape the card preview with a few quick choices.</p>

    <fieldset class="control-section">
      <legend>Background color</legend>
        <div class="btn-group">
          <button type="button" onclick="changeBg('#c94c4c')">Red</button>
          <button type="button" onclick="changeBg('#17202a')">Black</button>
          <button type="button" onclick="changeBg('#256d85')">Blue</button>
        </div>
    </fieldset>

    <fieldset class="control-section">
      <legend>Text color</legend>
        <div class="btn-group">
          <button type="button" onclick="changeTextColor('#ffffff')">White</button>
          <button type="button" onclick="changeTextColor('#f6c85f')">Gold</button>
          <button type="button" onclick="changeTextColor('#9bd0e5')">Sky</button>
        </div>
    </fieldset>

    <fieldset class="control-section">
      <legend>Text alignment</legend>
        <div class="btn-group">
          <button type="button" onclick="changeTextAlign('left')">Left</button>
          <button type="button" onclick="changeTextAlign('center')">Center</button>
          <button type="button" onclick="changeTextAlign('right')">Right</button>
        </div>
    </fieldset>

    <fieldset class="control-section">
      <legend>Profile image</legend>
        <div class="image-group">
          <button type="button" onclick="changeImage(this.querySelector('img').src)" aria-label="Choose profile image one"><img src="public/image (1).jpg" class="img-option" alt=""></button>
          <button type="button" onclick="changeImage(this.querySelector('img').src)" aria-label="Choose profile image two"><img src="public/apj.jpg" class="img-option" alt=""></button>
          <button type="button" onclick="changeImage(this.querySelector('img').src)" aria-label="Choose profile image three"><img src="public/image (3).jpg" class="img-option" alt=""></button>
        </div>
    </fieldset>
  </div>

  <div class="display-area">
    <h1 class="card-title">Identity Card</h1>
    
    <div class="card-border">
      <div class="card-content" id="idCard">
        <div class="details" id="cardText">
          <p>Name :- Rohan Prajapati</p>
          <p>Email :- xyz@gmail.com</p>
          <p>Mobile :- +91-9998979695</p>
          <p>City :- Moradabad</p>
          <p>State :- Uttar Pradesh</p>
          <p>Pincode :- 244001</p>
        </div>
        <img id="userImg" class="profile-photo" src="public/image (1).jpg" alt="Profile portrait">
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT FOR INTERACTIVITY -->
  <script>
    function changeBg(color) {
      document.getElementById('idCard').style.backgroundColor = color;
    }

    function changeTextColor(color) {
      document.getElementById('cardText').style.color = color;
    }

    function changeTextAlign(align) {
      document.getElementById('cardText').style.textAlign = align;
    }

    function changeImage(src) {
      document.getElementById('userImg').src = src;
    }
  </script>

</body>
</html>
